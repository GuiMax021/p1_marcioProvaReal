{% if is_paginated %}
<div class="barra">
  {% if page_obj.has_previous %}<a class="btn sec" href="?page={{ page_obj.previous_page_number }}{% if params %}&{{ params }}{% endif %}">« Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn sec" href="?page={{ page_obj.next_page_number }}{% if params %}&{{ params }}{% endif %}">Próxima »</a>{% endif %}
</div>
{% endif %}
